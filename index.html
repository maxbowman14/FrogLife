<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸 Save the Frog Pond</title>

<style>
body{
    margin:0;
    background:linear-gradient(to bottom,#87ceeb,#98fb98);
    font-family:Arial,sans-serif;
    text-align:center;
}

#game{
    max-width:1000px;
    margin:auto;
    padding:20px;
}

.panel{
    background:white;
    border-radius:20px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

button{
    display:block;
    width:90%;
    margin:10px auto;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2e8b57;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1f6a42;
}

#hud{
    display:flex;
    justify-content:space-around;
    flex-wrap:wrap;
    font-size:20px;
    font-weight:bold;
}

#frogTrack{
    position:relative;
    height:140px;
    background:#dfffd6;
    border-radius:20px;
    margin-top:20px;
    overflow:hidden;
}

.stage{
    position:absolute;
    top:80px;
    transform:translateX(-50%);
    font-size:40px;
}

#frog{
    position:absolute;
    left:20px;
    top:20px;
    font-size:50px;
    transition:left 1s;
}

#message{
    min-height:40px;
    font-size:20px;
    font-weight:bold;
}

.correct{
    color:green;
}

.incorrect{
    color:red;
}

#bossBar{
    width:100%;
    height:30px;
    background:#ddd;
    border-radius:15px;
    overflow:hidden;
}

#bossHealth{
    width:100%;
    height:100%;
    background:red;
    transition:.5s;
}

#progressContainer{
    width:100%;
    height:25px;
    background:#ddd;
    border-radius:20px;
    margin-top:15px;
}

#progress{
    width:0%;
    height:100%;
    background:limegreen;
}
</style>
</head>
<body>

<div id="game">

<h1>🐸 SAVE THE FROG POND 🐸</h1>

<div id="hud">
<div>⭐ XP: <span id="xp">0</span></div>
<div>❤️ Lives: <span id="lives">3</span></div>
<div>🏅 Rank: <span id="rank">Tadpole Recruit</span></div>
</div>

<div id="progressContainer">
<div id="progress"></div>
</div>

<div id="frogTrack">

<div id="frog">🐸</div>

<div class="stage" style="left:10%">🥚</div>
<div class="stage" style="left:30%">🐟</div>
<div class="stage" style="left:50%">🦎</div>
<div class="stage" style="left:70%">🐸</div>
<div class="stage" style="left:90%">👑</div>

</div>

<div class="panel">

<h2 id="title">Mission Briefing</h2>

<div id="question">
A toxic slime monster has scrambled the frog life cycle!
Help restore the pond by answering science questions.
</div>

<div id="answers"></div>

<div id="message"></div>

</div>

</div>

<script>

let xp=0;
let lives=3;
let current=0;
let bossHealth=100;

const questions=[

{
title:"Egg Stage",
question:"Frogs are ______ with backbones.",
answers:["Invertebrates","Vertebrates","Fish","Mammals"],
correct:1
},

{
title:"Tadpole Stage",
question:"Tadpoles breathe underwater using...",
answers:["Lungs","Skin","Gills","Legs"],
correct:2
},

{
title:"Growing Tadpole",
question:"What process changes a tadpole into a frog?",
answers:["Photosynthesis","Metamorphosis","Migration","Hibernation"],
correct:1
},

{
title:"Froglet Stage",
question:"What happens to the tadpole's tail?",
answers:["Gets longer","Turns into wings","Disappears","Becomes fins"],
correct:2
},

{
title:"Adult Frog",
question:"Adult frogs breathe air using...",
answers:["Gills","Fins","Scales","Lungs"],
correct:3
},

{
title:"Challenge",
question:"The jelly surrounding frog eggs helps...",
answers:[
"Protect them",
"Make them fly",
"Help them run",
"Turn them into fish"
],
correct:0
},

{
title:"Challenge",
question:"Frogs belong to which animal group?",
answers:[
"Birds",
"Amphibians",
"Reptiles",
"Mammals"
],
correct:1
},

{
title:"Challenge",
question:"Frogs are...",
answers:[
"Warm-blooded",
"Cold-blooded",
"Neither",
"Robots"
],
correct:1
}

];

function updateHUD(){

document.getElementById("xp").textContent=xp;
document.getElementById("lives").textContent=lives;

let rank="Tadpole Recruit";

if(xp>=40) rank="Froglet Explorer";
if(xp>=80) rank="Adult Frog";
if(xp>=120) rank="Pond Guardian";

document.getElementById("rank").textContent=rank;

let progress=(current/questions.length)*100;
document.getElementById("progress").style.width=progress+"%";

let frogPosition=20+(progress*7.5);
document.getElementById("frog").style.left=frogPosition+"px";
}

function loadQuestion(){

if(current>=questions.length){
startBossBattle();
return;
}

let q=questions[current];

document.getElementById("title").textContent=q.title;
document.getElementById("question").textContent=q.question;

let html="";

q.answers.forEach((answer,index)=>{

html += `
<button onclick="answerQuestion(${index})">
${answer}
</button>`;

});

document.getElementById("answers").innerHTML=html;
document.getElementById("message").innerHTML="";
}

function answerQuestion(choice){

let q=questions[current];

if(choice===q.correct){

xp+=20;

document.getElementById("message").innerHTML=
'<span class="correct">✅ Correct! +20 XP</span>';

current++;

updateHUD();

setTimeout(loadQuestion,1000);

}
else{

lives--;

document.getElementById("message").innerHTML=
'<span class="incorrect">❌ Not quite!</span>';

updateHUD();

if(lives<=0){

document.getElementById("question").innerHTML=
"💀 The pond has been overrun by pollution!";

document.getElementById("answers").innerHTML=
'<button onclick="location.reload()">Try Again</button>';

}
}
}

function startBossBattle(){

document.getElementById("title").innerHTML=
"👾 FINAL BOSS: Pollution Monster";

document.getElementById("question").innerHTML=`

<div id="bossBar">
<div id="bossHealth"></div>
</div>

<p>
Answer questions to defeat the Pollution Monster!
</p>
`;

document.getElementById("answers").innerHTML=`

<button onclick="bossAnswer(true)">
A frog begins life as an egg.
</button>

<button onclick="bossAnswer(false)">
Adult frogs use gills.
</button>

<button onclick="bossAnswer(true)">
Metamorphosis changes body shape.
</button>

`;
}

function bossAnswer(correct){

if(correct){

bossHealth-=34;

document.getElementById("bossHealth").style.width=
bossHealth+"%";

if(bossHealth<=0){

victory();
}

}
}

function victory(){

document.getElementById("title").innerHTML=
"🏆 POND SAVED!";

document.getElementById("question").innerHTML=`

<h2>Final XP: ${xp}</h2>

<p>
You restored the frog life cycle and defeated
the Pollution Monster!
</p>

<h3>
🐸 MASTER OF METAMORPHOSIS 🐸
</h3>

`;

document.getElementById("answers").innerHTML=
'<button onclick="location.reload()">Play Again</button>';

document.getElementById("message").innerHTML="";
}

updateHUD();
loadQuestion();

</script>
</body>
</html>
